<style>

  *{margin:0;padding:0;box-sizing:border-box}

      linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%);
  }
  .grid{
    position:absolute;inset:0;

      linear-gradient(90deg,rgba(123,47,190,.05) 1px,transparent 1px);

  .cog{position:absolute;right:-120px;top:-130px;width:420px;height:420px;color:var(--purple-hi);opacity:.06}

  .txt{position:relative;z-index:2}
  .eyebrow{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;
    font-size:25px;letter-spacing:.26em;text-transform:uppercase;color:var(--purple-hi);
    margin-bottom:14px;
  }
  .title{
    font-family:'Bebas Neue',sans-serif;font-size:80px;line-height:.92;
    color:var(--white);letter-spacing:.01em;white-space:nowrap;
  }
  .title .hi{color:var(--purple-hi)}
  .accent{width:90px;height:5px;margin:26px 0;background:linear-gradient(to right,var(--purple-hi),transparent)}
  .tags{
